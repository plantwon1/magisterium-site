<!DOCTYPE html>
<html>

<head>

  <title>Magisterium Chat</title>

  <style>

    body {
      margin: 0;
      font-family: Arial;
      background: #0f172a;
      color: white;

      display: flex;
      flex-direction: column;

      height: 100vh;
    }

    #chat {

      flex: 1;

      overflow-y: auto;

      padding: 20px;

      display: flex;
      flex-direction: column;

      gap: 16px;
    }

    .message {

      max-width: 800px;

      padding: 14px;

      border-radius: 14px;

      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {

      background: #2563eb;

      align-self: flex-end;
    }

    .assistant {

      background: #1e293b;

      align-self: flex-start;
    }

    #inputBar {

      display: flex;

      padding: 16px;

      background: #111827;

      border-top: 1px solid #334155;
    }

    #message {

      flex: 1;

      padding: 14px;

      font-size: 16px;

      border: none;
      outline: none;

      border-radius: 10px;

      background: #1e293b;

      color: white;
    }

    button {

      margin-left: 10px;

      padding: 14px 20px;

      border: none;

      border-radius: 10px;

      background: #2563eb;

      color: white;

      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

  </style>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

This website uses API from Magisterium AI, a Catholic chatbot.

</head>

<body>

  <div id="adminBox">
    <input id="adminPass" type="password" placeholder="Master password">
    <button onclick="enableMaster()">Enable Master Mode</button>
  </div>

  <div id="chat"></div>

  <div id="inputBar">

    <input
      id="message"
      type="text"
      placeholder="Ask something..."
    />

    <button onclick="sendMessage()">
      Send
    </button>

  </div>

<script>

  const chat =
    document.getElementById("chat");

  function addMessage(text, className) {

    const div =
      document.createElement("div");

    div.className =
      `message ${className}`;

    div.innerHTML =
      marked.parse(text);

    chat.appendChild(div);

    chat.scrollTop =
      chat.scrollHeight;
  }

  async function sendMessage() {

    const input =
      document.getElementById("message");

    const message =
      input.value.trim();

    if (!message) return;

    addMessage(message, "user");

    input.value = "";

    const response =
      await fetch("/chat", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message
        })
      });

    const data =
      await response.json();

    if (data.error) {
      addMessage(data.error, "assistant");
      return;
    }

    const reply =
      data.choices[0].message.content;

    typeMessage(reply);
  }

  document
    .getElementById("message")
    .addEventListener("keydown", (e) => {

      if (e.key === "Enter") {
        sendMessage();
      }
    });


  function enableMaster() {

    const password =
      document.getElementById("adminPass").value;

    fetch("/master", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ password })
    })
    .then(res => res.json())
    .then(data => {

      if (data.success) {
        addMessage("Master mode enabled", "assistant");
      } else {
        addMessage("Wrong password", "assistant");
      }

    });
  }


  function typeMessage(text) {

    const div =
      document.createElement("div");

    div.className =
      "message assistant";

    chat.appendChild(div);

    let i = 0;

    const interval = setInterval(() => {

      div.innerHTML =
        marked.parse(text.slice(0, i));

      chat.scrollTop =
        chat.scrollHeight;

      i++;

      if (i > text.length) {
        clearInterval(interval);
      }

    }, 10);
  }

</script>

</body>
</html>
